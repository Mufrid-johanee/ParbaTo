; ParbaTo queue worker (Supervisor)
; Replace /var/www/parbato and the www-data user for your host.

[program:parbato-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/parbato/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/parbato/storage/logs/worker.log
stopwaitsecs=3600
